version: '3.8'

services:
  finmate-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finmate_app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///data/finmate.db
      - DEBUG=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
